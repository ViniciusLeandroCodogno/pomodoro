[project]
name = "pomodoro"
version = "0.1.0"
description = "API para gerenciamento de sessões Pomodoro"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "asyncpg>=0.32.0,<1.0.0",
    "fastapi>=0.142.2,<1.0.0",
    "pydantic-settings>=2.15.0,<3.0.0",
    "sqlalchemy[asyncio]==2.1.3",
    "uvicorn[standard]>=0.53.0,<1.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1,<1.0.0",
    "pytest>=9.1.1,<10.0.0",
    "pytest-asyncio>=1.4.0,<2.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
